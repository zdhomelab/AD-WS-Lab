<svg width="180" height="180" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#0d0d0d"/>

  <!-- subtle tech grid -->
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <rect width="30" height="30" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  </pattern>
  <rect width="100%" height="100%" fill="url(#grid)" opacity="0.35"/>

  <!-- geometric ZD ribbon -->
  <polygon points="40,40 140,40 100,90" fill="#00aaff"/>
  <polygon points="40,140 140,140 100,90" fill="#e6e6e6"/>

  <!-- server icon -->
  <rect x="65" y="105" width="50" height="20" rx="3" fill="#888"/>
  <circle cx="75" cy="115" r="3" fill="#00aaff"/>
  <circle cx="85" cy="115" r="3" fill="#00aaff"/>

  <!-- ZD text -->
  <text x="50%" y="92%" fill="#00aaff" font-size="32" font-family="Segoe UI, sans-serif"
        text-anchor="middle">
    ZD
  </text>
</svg>
