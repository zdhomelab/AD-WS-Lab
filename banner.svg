<svg width="100%" height="220" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#0d0d0d"/>

  <!-- subtle tech texture -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <rect width="40" height="40" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  </pattern>
  <rect width="100%" height="100%" fill="url(#grid)" opacity="0.35"/>

  <!-- server rack icons -->
  <g fill="#888">
    <rect x="10%" y="30%" width="8%" height="40%" rx="4"/>
    <rect x="22%" y="30%" width="8%" height="40%" rx="4"/>
    <rect x="34%" y="30%" width="8%" height="40%" rx="4"/>
  </g>

  <!-- neon accent line -->
  <rect x="0" y="0" width="100%" height="6" fill="#00aaff"/>

  <!-- title -->
  <text x="50%" y="50%" fill="#e6e6e6" font-size="42" font-family="Segoe UI, sans-serif"
        text-anchor="middle" dominant-baseline="middle">
    ZeroDay Homelab
  </text>

  <!-- subtitle -->
  <text x="50%" y="72%" fill="#bfbfbf" font-size="20" font-family="Segoe UI, sans-serif"
        text-anchor="middle">
    Servers • Switches • Active Directory • Security Baseline
  </text>
</svg>

